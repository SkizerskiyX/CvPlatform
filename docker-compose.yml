services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cvplatform
      POSTGRES_USER: cvplatform
      POSTGRES_PASSWORD: cvplatform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvplatform -d cvplatform"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: CvPlatform.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__CvPlatform: Host=postgres;Port=5432;Database=cvplatform;Username=cvplatform;Password=cvplatform
      Cors__Origins__0: http://localhost:5173
      Jwt__Key: docker-dev-key-change-in-production-0123456789-abcdef
    ports:
      - "7000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: